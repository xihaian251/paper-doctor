  - claim_id: C6
    text: '$26\,048$'
    locator:
      path: tables/app-rtdl-datasets.tex
      line: 8
      text: '$26\,048$'
    form: NUMERIC_ATTRIBUTION
    links: [L5, L7]
  - claim_id: C7
    text: 'By default, the mean test score and its standard deviation are obtained by training a given model with tuned hyperparameters from scratch on a given dataset under 15 different random seeds.'
