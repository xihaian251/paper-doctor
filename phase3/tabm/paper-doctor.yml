      text: 'By default, the mean test score and its standard deviation are obtained by training a given model with tuned hyperparameters from scratch on a given dataset under 15 different random seeds.'
    form: SCOPE
    quantifier: numeric
    scope:
      declared_universe: 'the random-seed runs a default mean is taken over'
      stated_count: 15
      unit: aggregation
      universe_status: PARTIAL
      locator:
        path: main.tex
        line: 981
        text: 'By default, the mean test score and its standard deviation are obtained by training a given model with tuned hyperparameters from scratch on a given dataset under 15 different random seeds.'
    links: [L6]
  # Negative control: the paper's own bytes for Adult's test size, declared against the WRONG column.
  # The text is real, so the manifest layer cannot reject it; only the cell comparison can say that
  # the attribution is false. This is what a PD003 FAIL is for.
  - claim_id: C8
    text: '$16\,281$'
    locator:
      path: tables/app-rtdl-datasets.tex
      line: 8
      text: '$16\,281$'
    form: NUMERIC_ATTRIBUTION
    links: [L10, L11]
  # Chain 3: the transposed/merged-label table. The column name is exactly recoverable now, but the
  # row label is carried by a vertical merge onto two source rows, so the address has two readings
  # and PD must refuse rather than pick one.
  - claim_id: C9
    text: '$0.1601$'
    locator:
      path: main.tex
      line: 528
      text: '$0.1601$'
    form: NUMERIC_ATTRIBUTION
    links: [L12, L13]
